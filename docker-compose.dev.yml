# Development stack: one CPU container with the ABB RWS driver. It idles - you
# start nodes yourself. See README.md for the workflow.

services:
  control:
    build:
      context: .
      dockerfile: docker/control.Dockerfile
    image: abb_rws2_ros2_driver:dev
    container_name: abb_rws2_ros2_driver_dev
    network_mode: host
    # Fast DDS talks over shared memory; with a private /dev/shm other nodes
    # discover this one but no messages arrive.
    ipc: host
    stdin_open: true
    tty: true
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      # Otherwise python buffers its output when stdout is a pipe.
      PYTHONUNBUFFERED: "1"
    # One set of files seen from two places, so there is nothing to copy back
    # out. Colcon writes outside it, to /opt/colcon_ws, and not to a volume.
    volumes:
      - .:/workspace
      # Editor extensions and assistant logins - expensive to reinstall, and
      # otherwise thrown away with the container on every rebuild.
      - vscode-server:/root/.vscode-server
      - claude-home:/root/.claude
      - codex-home:/root/.codex
    command: sleep infinity

volumes:
  vscode-server:
  claude-home:
  codex-home:
