# Parameters for the robot controller node.

# This file is read again on every configure, so changing a value means editing
# it here and taking the node back through the lifecycle. The process stays up:
#
#   ros2 lifecycle set /robot_controller deactivate
#   ros2 lifecycle set /robot_controller cleanup
#   ros2 lifecycle set /robot_controller configure
#   ros2 lifecycle set /robot_controller activate
#
# It also overwrites anything set with `ros2 param set`.
# Change the key below if you rename the node.

robot_controller:
  ros__parameters:

    connection:
      # Controllers seen in the lab: 192.168.0.31, 192.168.0.37, 192.168.0.14,
      # 192.168.1.157
      ip_address: 192.168.50.10
      # 80 on the virtual controller, 443 on the physical one
      port: 80
      username: Admin
      password: robotics

    utility:
      send_keepalive: true
      keepalive_interval: 120.0
      send_joint_states: true
      joint_states_hz: 8.0

    # The RAPID buffer queue answers 500 while it is full and the robot has not
    # drained it yet. That is back-pressure, not an error, so we wait and retry.
    dipc:
      retry_max: 100
      retry_delay_s: 0.25
