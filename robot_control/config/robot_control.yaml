# Parameters for the robot controller node.

# Read once, when the launch file starts the node. Changing a value here means
# editing it and restarting the node; a lifecycle cycle alone will not pick it
# up, and anything set with `ros2 param set` before configuring stays.
#
# For the opposite - the file re-read on every configure, overwriting whatever
# was set by hand - give the node its own path in `config_file`.
# Change the key below if you rename the node.

robot_controller:
  ros__parameters:

    connection:
      ip_address: 192.168.0.37
      # 80 on the virtual controller, 443 on the physical one
      port: 443
      username: Admin
      password: robotics

    utility:
      send_keepalive: true
      keepalive_interval: 120.0
      send_joint_states: true
      joint_states_hz: 4.0

    # The RAPID buffer queue answers 500 while it is full and the robot has not
    # drained it yet. That is back-pressure, not an error, so we wait and retry.
    dipc:
      retry_max: 100
      retry_delay_s: 0.25
 
      health_check_s: 0.5

    # Sending a point is not executing it, so a goal finishes only once the
    # robot is done. These bound the waiting.
    motion:
      start_timeout_s: 5.0
      completion_timeout_s: 300.0
      stall_timeout_s: 30.0
      poll_interval_s: 0.5
